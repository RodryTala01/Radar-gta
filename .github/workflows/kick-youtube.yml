name: Kick a YouTube
on:
  push:
    branches: [main]
    paths: [.github/workflows/kick-youtube.yml]
  schedule:
    - cron: '17 */2 * * *'
    # Refuerzo temporal de lanzamiento. El control de fecha evita repetirlo cada año.
    - cron: '17 1-23/2 18-22 11 *'
    - cron: '47 * 18-22 11 *'
    - cron: '7,17,27,37,47,57 * 18-19 11 *'
  workflow_dispatch:
    inputs:
      playlist:
        description: URL HLS pública del clip en clips.kick.com
        required: true
        type: string
      title:
        description: Título del Short
        required: true
        type: string
      upload:
        description: Subir a YouTube como privado
        type: boolean
        default: false
concurrency:
  group: radar-gta-youtube
  cancel-in-progress: false
permissions: {}
jobs:
  prepare:
    if: github.event_name != 'push' || github.event.head_commit.message == 'Test Radar GTA backup queue with one public Short'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Comprobar vigencia del horario de lanzamiento
        id: launch_window
        env:
          TRIGGER_CRON: ${{ github.event.schedule }}
        run: |
          now=$(date -u +%s)
          start=$(date -u -d '2026-11-18 03:00:00 UTC' +%s)
          end=$(date -u -d '2026-11-22 03:00:00 UTC' +%s)
          launch_day_end=$(date -u -d '2026-11-19 03:00:00 UTC' +%s)
          burst_cron='7,17,27,37,47,57 * 18-19 11 *'
          if [[ -z "$TRIGGER_CRON" ]]; then
            echo 'active=true' >> "$GITHUB_OUTPUT"
          elif (( now >= start && now < launch_day_end )); then
            if [[ "$TRIGGER_CRON" == "$burst_cron" ]]; then
              echo 'active=true' >> "$GITHUB_OUTPUT"
            fi
          elif [[ "$TRIGGER_CRON" != "$burst_cron" ]] && { [[ "$TRIGGER_CRON" == '17 */2 * * *' ]] || (( now >= start && now < end )); }; then
            echo 'active=true' >> "$GITHUB_OUTPUT"
          fi
      - name: Recuperar historial de clips
        if: steps.launch_window.outputs.active == 'true' && (github.event_name != 'workflow_dispatch')
        uses: actions/cache/restore@v4
        with:
          path: radar-seen.txt
          key: radar-kick-history-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: radar-kick-history-
      - name: Buscar un clip de Kick
        if: steps.launch_window.outputs.active == 'true' && (github.event_name != 'workflow_dispatch')
        run: |
          python3 - <<'PY'
          import concurrent.futures
          import os
          import re
          from pathlib import Path
          from urllib.request import urlopen

          history = Path("radar-seen.txt")
          seen = set(history.read_text().splitlines()) if history.exists() else set()
          seen.update(("clip_01M7QDZ8PVTH7C02R3707BNP9A", "clip_01M7QBZWX82JKAQ03GCSG5QSG1"))

          def read(url):
              with urlopen(url, timeout=12) as response:
                  return response.read(12_000_000).decode("utf-8", errors="replace")

          fallback = [["eldrizx","clip_01M7Q574VGFZ58N6EQPPBB3JNG","https://clips.kick.com/clips/9b/clip_01M7Q574VGFZ58N6EQPPBB3JNG/playlist.m3u8"],["eldrizx","clip_01M7Q5SB30W1XGAHG7SC85QDFQ","https://clips.kick.com/clips/1f/clip_01M7Q5SB30W1XGAHG7SC85QDFQ/playlist.m3u8"]]
          seen.add("clip_01M7QGRKDMMZDP1B12J4CWPJA0")
          from urllib.error import HTTPError, URLError

          # Idioma habitual del canal. El audio de cada clip puede variar.
          spanish = {"rdjavi", "riversgg", "gaviria777", "eldrizx", "ibai", "auronplay", "juansguarnizo", "illojuan"}
          english = {"darkviperau", "typicalgamer", "xqc", "popenzl", "tgg", "joshimuz", "theburntpeanut", "jasontheween", "jelly", "caylus"}
          page = ""
          if os.environ["GITHUB_EVENT_NAME"] == "schedule":
              try:
                  page = read("https://kick.com/category/grand-theft-auto-vi/clips")
              except (HTTPError, URLError, TimeoutError) as error:
                  print(f"Categoría de Kick no disponible; se usará la cola de respaldo ({error}).")
          candidates = list(dict.fromkeys(re.findall(r"/([a-zA-Z0-9_-]+)/clips/(clip_[A-Z0-9]+)", page)))
          candidates = [item for item in candidates if item[0].lower() in spanish | english]
          candidates.sort(key=lambda item: item[0].lower() not in spanish)

          def resolve(candidate):
              author, clip_id = candidate
              try:
                  html = read(f"https://kick.com/{author}/clips/{clip_id}")
                  match = re.search(
                      r"https://clips\.kick\.com/clips/[a-zA-Z0-9/_-]+\.m3u8",
                      html,
                  )
                  if match and f"/{clip_id}/" in match[0]:
                      return author, clip_id, match[0]
              except OSError:
                  return None

          with concurrent.futures.ThreadPoolExecutor(max_workers=4) as pool:
              results = list(pool.map(resolve, [item for item in candidates if item[1] not in seen][:12]))
          selected = next((result for result in results if result), None)
          if not selected:
              for author, clip_id, playlist in fallback:
                  if clip_id in seen:
                      continue
                  try:
                      if read(playlist).startswith("#EXTM3U"):
                          selected = author, clip_id, playlist
                          break
                  except (OSError, TimeoutError):
                      continue
          if not selected:
              print("No hay clips nuevos con una lista HLS accesible.")
              raise SystemExit(0)
          author, clip_id, playlist = selected
          with open(os.environ["GITHUB_ENV"], "a") as env:
              print(f"RADAR_PLAYLIST={playlist}", file=env)
              print(f"RADAR_CLIP_ID={clip_id}", file=env)
              print(f"RADAR_TITLE=GTA VI | Clip de {author}"[:100], file=env)
          PY
      - name: Preparar MP4 vertical
        if: steps.launch_window.outputs.active == 'true' && (github.event_name == 'workflow_dispatch' || env.RADAR_PLAYLIST != '')
        env:
          PLAYLIST: ${{ inputs.playlist || env.RADAR_PLAYLIST }}
        run: |
          set -euo pipefail
          [[ "$PLAYLIST" =~ ^https://clips\.kick\.com/clips/[a-zA-Z0-9/_-]+\.m3u8$ ]]
          if ! command -v ffmpeg >/dev/null; then
            sudo apt-get update -qq
            sudo apt-get install -y ffmpeg
          fi
          ffmpeg -nostdin -hide_banner -loglevel error -rw_timeout 15000000 \
            -i "$PLAYLIST" -t 30 -map 0:v:0 -map 0:a:0 \
            -vf "scale=720:1280:force_original_aspect_ratio=increase:force_divisible_by=2,crop=720:1280,setsar=1" \
            -c:v libx264 -preset fast -pix_fmt yuv420p -c:a aac -movflags +faststart clip.mp4
          ffprobe -v error -show_entries stream=codec_name,width,height:format=duration -of compact clip.mp4
      - name: Reservar clip para evitar subidas duplicadas
        if: steps.launch_window.outputs.active == 'true' && (github.event_name != 'workflow_dispatch' && env.RADAR_CLIP_ID != '')
        run: printf '%s\n' "$RADAR_CLIP_ID" >> radar-seen.txt
      - name: Guardar historial antes de subir
        if: steps.launch_window.outputs.active == 'true' && (github.event_name != 'workflow_dispatch' && env.RADAR_CLIP_ID != '')
        uses: actions/cache/save@v4
        with:
          path: radar-seen.txt
          key: radar-kick-history-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Subir MP4 a YouTube
        if: steps.launch_window.outputs.active == 'true' && (inputs.upload || (github.event_name != 'workflow_dispatch' && env.RADAR_PLAYLIST != ''))
        env:
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
          VIDEO_TITLE: ${{ inputs.title || env.RADAR_TITLE }}
        run: |
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path
          from urllib.error import HTTPError
          from urllib.parse import urlencode, urlsplit
          from urllib.request import Request, urlopen

          fields = {
              "client_id": "YOUTUBE_CLIENT_ID",
              "client_secret": "YOUTUBE_CLIENT_SECRET",
              "refresh_token": "YOUTUBE_REFRESH_TOKEN",
          }
          missing = [name for name in fields.values() if not os.environ[name]]
          if missing:
              raise SystemExit("Faltan secretos: " + ", ".join(missing))
          visibility = "public" if os.environ["GITHUB_EVENT_NAME"] != "workflow_dispatch" else "private"
          title = os.environ["VIDEO_TITLE"].strip()
          if not 1 <= len(title) <= 100:
              raise SystemExit("El título debe tener entre 1 y 100 caracteres.")

          def send(url, data, headers, step, method="POST"):
              try:
                  return urlopen(Request(url, data=data, headers=headers, method=method), timeout=90)
              except HTTPError as exc:
                  raise SystemExit(f"{step}: HTTP {exc.code}") from None

          params = {field: os.environ[name] for field, name in fields.items()}
          params["grant_type"] = "refresh_token"
          with send("https://oauth2.googleapis.com/token", urlencode(params).encode(),
                    {"Content-Type": "application/x-www-form-urlencoded"}, "OAuth") as response:
              token = json.load(response)["access_token"]
          authorization = {"Authorization": "Bearer " + token}
          media = Path("clip.mp4")
          metadata = {
              "snippet": {"title": title, "description": "Fuente: Kick", "categoryId": "20"},
              "status": {"privacyStatus": visibility},
          }
          endpoint = "https://www.googleapis.com/upload/youtube/v3/videos?uploadType=resumable&part=snippet,status&notifySubscribers=false"
          headers = authorization | {
              "Content-Type": "application/json",
              "X-Upload-Content-Type": "video/mp4",
              "X-Upload-Content-Length": str(media.stat().st_size),
          }
          with send(endpoint, json.dumps(metadata).encode(), headers, "Inicio de subida") as response:
              session = response.headers["Location"]
          target = urlsplit(session)
          if target.scheme != "https" or target.hostname != "www.googleapis.com":
              raise SystemExit("YouTube devolvió un destino inesperado.")
          with send(session, media.read_bytes(), authorization | {"Content-Type": "video/mp4"},
                    "Transferencia del MP4", "PUT") as response:
              video = json.load(response)
          actual = video.get("status", {}).get("privacyStatus")
          video_id = video.get("id")
          if not video_id:
              raise SystemExit("YouTube no devolvió el ID del video.")
          print("Video: https://www.youtube.com/watch?v=" + video_id)
          if actual != visibility:
              raise SystemExit(f"YouTube devolvió visibilidad {actual!r}; se solicitó {visibility!r}.")
          print(f"Visibilidad confirmada: {actual}")
          PY
